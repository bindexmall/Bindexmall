name: bindexmall
description: A modern e-commerce application built with Flutter
publish_to: 'none'
version: 1.1.0+16

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  sentry_flutter: ^10.0.0-alpha.1
  flutter:
    sdk: flutter
  provider: ^6.1.1
  cupertino_icons: ^1.0.6
  flutter_staggered_grid_view: ^0.7.0
  uuid: ^4.2.2
  intl: ^0.20.2
  equatable: ^2.0.7
  http: ^1.5.0
  shared_preferences: ^2.5.3
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^3.4.1
  dio: ^5.9.0
  webview_flutter: ^4.13.0
  image_picker: ^1.2.0
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  permission_handler: ^13.0.1
  flutter_inappwebview: ^6.1.5
  path: ^1.9.1
  mime: ^2.0.0
  crypto: ^3.0.6
  share_plus: ^13.1.0
  app_links: ^7.2.0
  in_app_update: ^5.0.0
  video_player: ^2.14.0

dev_dependencies:
  change_app_package_name: any
  sentry_dart_plugin: ^3.2.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: flutter
  org: bmn-13
